{% load static %}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login | Lizenzmanagement</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f4;
            color: #111;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 0, 0, 0.10), transparent 32%),
                radial-gradient(circle at 80% 30%, rgba(0, 0, 0, 0.08), transparent 30%),
                linear-gradient(135deg, #f7f7f7 0%, #e9e9e9 100%);
            overflow: hidden;
        }

        .app-shell-preview {
            position: absolute;
            inset: 24px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 28px;
            filter: blur(7px);
            transform: scale(1.025);
            opacity: 0.42;
        }

        .sidebar-preview {
            border-radius: 28px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
        }

        .content-preview {
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.10);
            position: relative;
            overflow: hidden;
        }

        .content-preview::before {
            content: "";
            position: absolute;
            top: 42px;
            left: 42px;
            width: 220px;
            height: 26px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.10);
        }

        .content-preview::after {
            content: "";
            position: absolute;
            left: 42px;
            right: 42px;
            bottom: 42px;
            height: 62%;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
        }

        .preview-card-row {
            position: absolute;
            top: 100px;
            left: 42px;
            right: 42px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            z-index: 2;
        }

        .preview-card {
            height: 96px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.06);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            padding: 34px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            animation: floatIn 0.35s ease-out;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.03em;
        }

        .login-subtitle {
            color: #666;
            margin: 0 0 28px 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            border: 1px solid #d8d8d8;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        input:focus {
            border-color: #111;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.06);
        }

        .error {
            background: #fff0f0;
            border: 1px solid #f0b8b8;
            color: #9b1c1c;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 15px 18px;
            font-size: 15px;
            font-weight: 800;
            background: #111;
            color: white;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.20);
        }

        .login-button:hover {
            background: #333;
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.24);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .hint {
            margin-top: 18px;
            font-size: 13px;
            color: #777;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 800px) {
            .app-shell-preview {
                grid-template-columns: 1fr;
                inset: 16px;
            }

            .sidebar-preview {
                display: none;
            }

            .preview-card-row {
                grid-template-columns: 1fr;
            }

            .login-card {
                padding: 28px;
                border-radius: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="app-shell-preview">
            <div class="sidebar-preview"></div>

            <div class="content-preview">
                <div class="preview-card-row">
                    <div class="preview-card"></div>
                    <div class="preview-card"></div>
                    <div class="preview-card"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay">
        <div class="login-card">
            <h1 class="login-title">Anmelden</h1>
            <p class="login-subtitle">
                Bitte melde dich an, um geschützte Funktionen im Lizenzmanagement zu verwenden.
            </p>

            {% if fehler %}
                <div class="error">{{ fehler }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <input type="hidden" name="next" value="{{ next }}">

                <div class="form-group">
                    <label for="username">Benutzername oder E-Mail-Adresse</label>
                    <input id="username" type="text" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                </div>

                <button class="login-button" type="submit">
                    Einloggen
                </button>
            </form>

            <div class="hint">
                Neue Konten werden über eine persönliche Einladung aktiviert.
            </div>
        </div>
    </div>
</body>
</html>
