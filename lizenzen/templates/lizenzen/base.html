<!DOCTYPE html>
<html lang="de">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lizenzmanagement{% endblock %}</title>

    <style>
        :root {
            --dpz-green: #3A7F31;
            --dpz-green-dark: #2f6728;
            --dpz-green-soft: rgba(58, 127, 49, 0.12);
            --black: #111;
            --dark: #1f1f1f;
            --bg: #f5f5f5;
            --text: #222;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        html {
            scroll-behavior: smooth;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            top: 24px;
            left: 24px;
            bottom: 100px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
            z-index: 100;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            padding: 14px 20px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .sidebar-brand img {
            display: block;
            width: 190px;
            max-width: 100%;
            height: auto;
        }

        .sidebar-navigation {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 18px;
            border-radius: 26px;
            background: var(--black);
            color: white;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            min-height: 0;
        }

        .sidebar-navigation > * {
            flex-shrink: 0;
        }

        .sidebar-navigation > .nav-main:last-of-type {
            margin-bottom: 0;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 24px;
        }

        .sidebar-demo {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 12px 14px;
            border: 1px solid rgba(117, 166, 99, 0.16);
            border-radius: 14px;
            background: rgba(58, 127, 49, 0.13);
            line-height: 1.4;
        }

        .sidebar-demo strong {
            color: #bed5b5;
            font-size: 12px;
            font-weight: 600;
        }

        .sidebar-demo a {
            align-self: flex-start;
            color: #8cb67e;
            font-size: 11px;
            text-decoration: none;
            text-underline-offset: 3px;
        }

        .sidebar-demo a:hover {
            color: #c4dfb9;
            text-decoration: underline;
        }

        .sidebar a:focus-visible,
        .sidebar button:focus-visible {
            outline: 3px solid #78bd6d;
            outline-offset: 3px;
        }


        .nav-main {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.08);
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .nav-main:hover {
            background-color: rgba(58, 127, 49, 0.12);
            color: white;
            transform: translateX(2px);
        }

        .nav-group {

            margin-top: 2px;

            margin-bottom: 2px;

        }

        .nav-group-title {

            width: 100%;
            border: 0;
            box-sizing: border-box;
            text-align: left;
            font-family: inherit;
            font-size: inherit;

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: white;

            padding: 13px 14px;

            border-radius: 14px;

            font-weight: bold;

            background-color: rgba(255, 255, 255, 0.08);

            margin-bottom: 8px;

            cursor: pointer;

            user-select: none;

            transition:

                background-color 0.2s ease,

                transform 0.2s ease,

                box-shadow 0.2s ease;

        }

        .nav-group-title:hover {

            background-color: rgba(58, 127, 49, 0.12);

        }

        .nav-group-title::after {

            content: "▼";

            font-size: 11px;

            color: #bdbdbd;

            transition: transform 0.25s ease;

        }

        .nav-group.closed .nav-group-title::after {

            transform: rotate(-90deg);

        }

        .nav-group-items {

            overflow: hidden;

            max-height: 500px;

            opacity: 1;

            transform: translateY(0);

            transition:

                max-height 0.35s ease,

                opacity 0.25s ease,

                transform 0.25s ease;

        }

        .nav-group.closed .nav-group-items {

            max-height: 0;

            opacity: 0;

            transform: translateY(-6px);

            pointer-events: none;

        }

        .nav-sub {

            display: block;

            color: #dcdcdc;

            text-decoration: none;

            padding: 10px 12px 10px 28px;

            border-radius: 12px;

            margin-bottom: 5px;

            font-size: 14px;

            position: relative;

            overflow: hidden;

            transition:

                background-color 0.2s ease,

                color 0.2s ease,

                transform 0.2s ease,

                opacity 0.2s ease,

                box-shadow 0.2s ease;

        }

        .nav-sub:hover {

            background-color: rgba(58, 127, 49, 0.10);

            color: white;

            transform: translateX(2px);

        }

       .nav-active {
            background: rgba(58, 127, 49, 0.18);
            color: white !important;
            font-weight: bold;
            border: 1px solid rgba(58, 127, 49, 0.42);
            box-shadow:
                0 8px 22px rgba(58, 127, 49, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .nav-main.nav-active {
            background: rgba(58, 127, 49, 0.20);
            color: white !important;
            font-weight: bold;
            border: 1px solid rgba(58, 127, 49, 0.50);
            box-shadow:
                0 8px 22px rgba(58, 127, 49, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .nav-active:hover {
            background: rgba(58, 127, 49, 0.24);
            color: white !important;
            border-color: rgba(58, 127, 49, 0.58);
            transform: translateX(2px);
        }
        .content {
            margin-left: 340px;
            padding: 56px 48px;
        }

        .karte {
            background: white;
            width: 100%;
            max-width: 1180px;
            padding: 34px 38px;
            border-radius: 22px;
            box-shadow: 0 10px 34px rgba(0,0,0,0.08);
            margin-bottom: 32px;
            box-sizing: border-box;
        }

        .seiten-karte {
            width: 100%;
            max-width: 1180px;
            min-width: 900px;
        }

        h1 {
            margin-top: 6px;
            margin-bottom: 24px;
            font-size: 32px;
            line-height: 1.1;
        }

        h2 {
            margin-top: 28px;
        }

        .zurueck-link {
            display: inline-block;
            margin-bottom: 10px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .zurueck-link:hover {
            color: var(--dpz-green);
            text-decoration: underline;
        }

        .table-container {
            width: 100%;
            max-width: 100%;
            max-height: 520px;
            overflow: auto;
            margin-top: 22px;
            border: 1px solid #e2e2e2;
            border-radius: 16px;
            background: white;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.03);
            box-sizing: border-box;
            position: relative;
        }

        .table-container::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .table-container::-webkit-scrollbar-track {
            background: transparent;
            margin-top: 36px;
            margin-bottom: 6px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #999;
            border-radius: 999px;
            border: 2px solid white;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        table {
            width: 100%;
            min-width: 1100px;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 0;
            background: white;
        }

        th,
        td {
            border-bottom: 1px solid #e5e5e5;
            text-align: left;
            font-size: 14px;
            vertical-align: middle;
            word-break: normal;
            overflow-wrap: anywhere;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--dark);
            color: white;
            font-weight: 700;
            padding: 8px 14px;
            line-height: 1.15;
            white-space: nowrap;
        }

        td {
            padding: 11px 14px;
            line-height: 1.25;
        }

        th:first-child {
            border-top-left-radius: 15px;
        }

        th:last-child {
            border-top-right-radius: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f7f7f7;
        }

        th.id-spalte,
        td.id-spalte {
            width: 90px;
            min-width: 90px;
            max-width: 90px;
            white-space: nowrap;
            word-break: normal;
            overflow-wrap: normal;
            text-align: left;
        }

        th:last-child,
        td:last-child {
            min-width: 95px;
            white-space: nowrap;
            text-align: left;
        }

        .klickbare-zeile {
            cursor: pointer;
        }

        .klickbare-zeile:hover {
            background-color: #eeeeee;
        }

        .zeilen-link {
            display: block;
            color: inherit;
            text-decoration: none;
            width: 100%;
            height: 100%;
        }

        .suchformular {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            margin-bottom: 18px;
            align-items: stretch;
        }

        .suchformular input {
            flex: 2.2;
            min-width: 260px;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
        }

        .suchformular select {
            flex: 1;
            min-width: 180px;
            max-width: 260px;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            background-color: white;
        }

        .suchformular button,
        .suchformular a {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            background-color: var(--dpz-green);
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }

        .suchformular a {
            background-color: #555;
        }

        .suchformular button:hover {
            background-color: var(--dpz-green-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(58, 127, 49, 0.20);
        }

        .suchformular a:hover {
            background-color: #333;
        }

        .leer-hinweis {
            margin-top: 20px;
            padding: 16px;
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 10px;
            color: #555;
        }

        .ergebnis-hinweis {
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }

        .erfolg-hinweis {
            margin-top: 20px;
            padding: 16px;
            background-color: rgba(58, 127, 49, 0.10);
            border: 1px solid rgba(58, 127, 49, 0.30);
            border-radius: 10px;
            color: var(--dpz-green-dark);
        }

        .hinweis-box {
            margin-top: 14px;
            margin-bottom: 18px;
            padding: 14px 16px;
            background-color: rgba(58, 127, 49, 0.10);
            border: 1px solid rgba(58, 127, 49, 0.28);
            border-radius: 12px;
            color: var(--dpz-green-dark);
            font-size: 14px;
            line-height: 1.45;
        }

        .formular {
            display: grid;
            gap: 10px;
            width: 100%;
            max-width: 680px;
            margin-top: 30px;
        }

        .formular label {
            font-weight: bold;
            margin-top: 8px;
        }

        .formular input,
        .formular select,
        .formular textarea {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .formular-aktionen {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .formular-aktionen button,
        .formular-aktionen a {
            padding: 11px 16px;
            border-radius: 8px;
            border: none;
            background-color: var(--dpz-green);
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }

        .formular-aktionen button:hover,
        .formular-aktionen a:hover {
            background-color: var(--dpz-green-dark);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(58, 127, 49, 0.20);
        }

        .tabellen-link {
            color: #111;
            text-decoration: none;
        }

        .tabellen-link:hover {
            color: var(--dpz-green);
            text-decoration: underline;
        }

        .klickbare-dashboard-zeile {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .klickbare-dashboard-zeile:hover {
            background-color: #eeeeee;
        }

        .detail-aktionen-reihe {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .detail-aktionen-reihe form {
            margin: 0;
        }

        details summary {
            cursor: pointer;
            list-style: none;
            font-size: 20px;
            margin-bottom: 0;
        }

        details[open] summary {
            margin-bottom: 16px;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        details summary::after {
            content: " ▼";
            font-size: 14px;
            color: #777;
        }

        details[open] summary::after {
            content: " ▲";
        }

        details p {
            margin-top: 10px;
        }

        .zuweisungsart-auswahl {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 8px 0 30px 0;
        }

        .zuweisungsart-karte {
            display: inline-grid;
            gap: 5px;
            width: auto;
            min-width: 190px;
            max-width: 230px;
            padding: 15px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background-color: #f8f8f8;
            color: #222;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .zuweisungsart-karte:hover {
            border-color: var(--dpz-green);
            background-color: #fff;
            box-shadow: 0 10px 28px rgba(58, 127, 49, 0.12);
        }

        .zuweisungsart-karte.aktiv {
            border-color: var(--dpz-green);
            background-color: var(--dpz-green);
            color: #fff;
        }

        .zuweisungsart-karte span {
            font-size: 13px;
            color: inherit;
            opacity: 0.85;
        }

        .zuweisungsbereich {
            display: none;
        }

        .zuweisungsbereich.aktiv {
            display: block;
        }

        .benutzer-auswahl-block {
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
        }

        .benutzer-filter-zeile {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .benutzer-filter-feld {
            display: grid;
            gap: 8px;
            flex: 1;
        }

        .benutzer-filter-feld.klein {
            flex: 0 0 240px;
        }

        .benutzer-filter-feld label {
            font-weight: bold;
            margin-top: 8px;
        }

        .benutzer-filter-feld input,
        .benutzer-filter-feld select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
        }

        .benutzer-suche-wrapper {
            position: relative;
            width: 100%;
        }

        .benutzer-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 300;
            max-height: 260px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
        }

        .benutzer-dropdown.aktiv {
            display: grid;
            gap: 8px;
        }

        .benutzer-dropdown-eintrag {
            display: grid;
            gap: 4px;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 9px;
            background-color: #f8f8f8;
            color: #222;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .benutzer-dropdown-eintrag:hover {
            border-color: var(--dpz-green);
            background-color: #fff;
        }

        .benutzer-dropdown-eintrag.aktiv {
            border-color: var(--dpz-green);
            background-color: var(--dpz-green);
            color: #fff;
        }

        .benutzer-dropdown-eintrag span {
            font-size: 13px;
            opacity: 0.8;
        }

        .auswahl-anzeige {
            margin-top: 14px;
            padding: 13px 15px;
            border-radius: 10px;
            background-color: #f1f1f1;
            font-size: 14px;
            color: #333;
        }

        .report-hero {
            max-width: 1180px;
            padding: 46px 48px;
            border-radius: 28px;
            background: linear-gradient(135deg, #1f1f1f 0%, #111 100%);
            color: white;
            margin-bottom: 28px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.20);
        }

        .report-hero h1 {
            font-size: 42px;
            margin: 12px 0 10px 0;
            letter-spacing: -0.04em;
        }

        .report-hero p {
            margin: 0;
            color: #e0e0e0;
            font-size: 16px;
        }

        .seiten-label {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--dpz-green);
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .dashboard-top-neu {
            max-width: 1180px;
            display: grid;
            grid-template-columns: 1fr 270px;
            gap: 18px;
            margin-bottom: 22px;
        }

        .dashboard-statistik-neu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .report-card,
        .report-card:visited,
        .report-card:active {
            display: block;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 18px;
            padding: 24px 26px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.08);
            min-height: 88px;
            box-sizing: border-box;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
        }

        .report-card:hover {
            background: var(--dpz-green);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 14px 38px rgba(58, 127, 49, 0.22);
        }

        .report-card strong {
            display: block;
            margin-top: 8px;
            font-size: 29px;
            letter-spacing: -0.03em;
            color: inherit;
            text-decoration: none;
        }

        .report-card span,
        .report-card .report-label {
            color: inherit;
            text-decoration: none;
        }

        .report-label {
            display: block;
            color: #666;
            font-size: 14px;
        }

        .report-card:hover .report-label,
        .report-card:hover span,
        .report-card:hover strong {
            color: white;
            text-decoration: none;
        }

        .dashboard-hinweise-neu {
            display: grid;
            gap: 18px;
        }

        .dashboard-hinweis-card,
        .dashboard-hinweis-card:visited,
        .dashboard-hinweis-card:active {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 18px;
            padding: 22px 24px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.08);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
        }

        .dashboard-hinweis-card:hover {
            background: var(--dpz-green);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 14px 38px rgba(58, 127, 49, 0.22);
        }

        .dashboard-hinweis-card span {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            color: inherit;
            text-decoration: none;
        }

        .dashboard-hinweis-card p {
            margin: 0;
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }

        .dashboard-hinweis-card strong {
            font-size: 30px;
            color: inherit;
            text-decoration: none;
        }

        .dashboard-hinweis-card:hover span,
        .dashboard-hinweis-card:hover p,
        .dashboard-hinweis-card:hover strong {
            color: white;
            text-decoration: none;
        }

        .dashboard-main-card {
            max-width: 1180px;
            border-radius: 22px;
        }

        .bereich-kopf {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 18px;
        }

        .bereich-kopf h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
        }

        .bereich-kopf p {
            margin: 0;
            color: #555;
        }

        .compact-table table {
            min-width: 760px;
            margin-top: 0;
        }

        .compact-table th,
        .compact-table td {
            padding: 12px 14px;
        }

        .detail-header {
            width: 100%;
            max-width: 1180px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 28px;
        }

        .detail-header h1 {
            margin-bottom: 12px;
        }

<style>
.sidebar-header { display: contents; }
.mobile-menu-toggle { display: none; }
@media (max-width: 700px) {
    .sidebar { margin: 0 16px; gap: 0; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; min-height: 70px; }
    .sidebar-brand { padding: 10px 0; min-height: 60px; }
    .sidebar-brand img, .sidebar-brand svg { width: 166px; }
    .mobile-menu-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; min-height: 44px; border: 1px solid #dce3d9; border-radius: 13px; background: white; color: #263823; font: 600 13px Arial,sans-serif; cursor: pointer; }
    .sidebar-navigation { display: none !important; flex: none; padding: 14px; margin-bottom: 8px; max-height: calc(100dvh - 100px); }
    .sidebar.menu-open .sidebar-navigation { display: flex !important; }
    .sidebar-navigation .nav-main, .sidebar-navigation .nav-group-title { margin-bottom: 8px; min-height: 44px; box-sizing: border-box; }
    .sidebar-footer { padding-top: 14px; }
    .content { padding: 8px 16px 28px; }
}
</style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar" aria-label="Seitennavigation">
            <div class="sidebar-header">
            <a class="sidebar-brand" href="/dashboard/" aria-label="DPZ · Zur Übersicht">
                <img src="{% static 'lizenzen/dpz-logo.svg' %}" alt="Deutsches Primatenzentrum">
            </a>
            <button type="button" class="mobile-menu-toggle" aria-expanded="false" aria-controls="main-navigation"><span aria-hidden="true">☰</span> Menü</button>
            </div>
            <nav class="sidebar-navigation" id="main-navigation" aria-label="Hauptnavigation">

            <a
                class="nav-main {% if request.path == '/dashboard/' %}nav-active{% endif %}"
                href="/dashboard/"
            >
                Dashboard
            </a>

            <div class="nav-group" id="lizenzen-menu">
                <button type="button" class="nav-group-title" aria-expanded="true" aria-controls="lizenzen-menu-items" onclick="toggleNavGroup('lizenzen-menu')">
                    Lizenzen
                </button>

                <div class="nav-group-items" id="lizenzen-menu-items">
                    <a
                        class="nav-sub
                            {% if request.path == '/lizenzen/' %}
                                nav-active
                            {% elif request.path == '/lizenzen/hinzufuegen/' %}
                                nav-active
                            {% elif request.path|slice:':10' == '/lizenzen/' and request.resolver_match.url_name != 'lizenz_zuweisen' %}
                                nav-active
                            {% endif %}"
                        href="/lizenzen/"
                    >
                        Lizenzverwaltung
                    </a>

                    <a
                        class="nav-sub
                            {% if request.path == '/lizenzen/zuweisen/' %}
                                nav-active
                            {% elif request.resolver_match.url_name == 'lizenz_zuweisen' %}
                                nav-active
                            {% endif %}"
                        href="/lizenzen/zuweisen/"
                    >
                        Lizenz zuweisen
                    </a>
                </div>
            </div>

            <div class="nav-group" id="bestand-menu">
                <button type="button" class="nav-group-title" aria-expanded="true" aria-controls="bestand-menu-items" onclick="toggleNavGroup('bestand-menu')">
                    Bestand
                </button>

                <div class="nav-group-items" id="bestand-menu-items">
                    <a
                        class="nav-sub {% if request.path == '/benutzer/' %}nav-active{% endif %}"
                        href="/benutzer/"
                    >
                        Benutzer
                    </a>

                    <a
                        class="nav-sub {% if request.path == '/geraete/' %}nav-active{% endif %}"
                        href="/geraete/"
                    >
                        Geräte
                    </a>
                </div>
            </div>

            <a
                class="nav-main
                    {% if request.path == '/synchronisation/' %}
                        nav-active
                    {% elif request.path == '/synchronisation/hinzufuegen/' %}
                        nav-active
                    {% elif request.path == '/synchronisation/ad/' %}
                        nav-active
                    {% elif request.path == '/lizenzen/adobe-import/' %}
                        nav-active
                    {% endif %}"
                href="{% url 'synchronisation_uebersicht' %}"
            >
                Datenquellen
            </a>
            <div class="sidebar-footer">
                <div class="sidebar-demo">
                    <strong>Lizenzmanagement-Demo</strong>
                    <a href="https://github.com/mhicyor/lizenzmanagement-django" target="_blank" rel="noopener noreferrer">Quellcode auf GitHub <span aria-hidden="true">↗</span></a>
                </div>
            </div>
            </nav>
        </aside>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script>
        function toggleNavGroup(groupId) {
            const group = document.getElementById(groupId);

            if (group) {
                group.classList.toggle("closed");
                updateNavGroup(group);
            }
        }

        function updateNavGroup(group) {
            const closed = group.classList.contains("closed");
            group.querySelector(".nav-group-title").setAttribute("aria-expanded", String(!closed));
            group.querySelector(".nav-group-items").inert = closed;
        }

        document.addEventListener("DOMContentLoaded", function () {
            const rail = document.querySelector('.sidebar');
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            menuToggle.addEventListener('click', function () {
                const open = rail.classList.toggle('menu-open');
                menuToggle.setAttribute('aria-expanded', String(open));
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && rail.classList.contains('menu-open')) {
                    rail.classList.remove('menu-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.focus();
                }
            });
            const currentPath = window.location.pathname;

            const lizenzenMenu = document.getElementById("lizenzen-menu");
            const bestandMenu = document.getElementById("bestand-menu");

            if (
                lizenzenMenu &&
                !currentPath.startsWith("/lizenzen/")
            ) {
                lizenzenMenu.classList.add("closed");
            }

            if (
                bestandMenu &&
                !currentPath.startsWith("/benutzer/") &&
                !currentPath.startsWith("/geraete/")
            ) {
                bestandMenu.classList.add("closed");
            }
            [lizenzenMenu, bestandMenu].filter(Boolean).forEach(updateNavGroup);
        });
    </script>
</body>
