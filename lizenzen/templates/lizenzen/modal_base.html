<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Lizenzmanagement{% endblock %}</title>

    <style>
        :root {
            --dpz-green: #3A7F31;
            --dpz-green-dark: #2f6828;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #111;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        a {
            color: inherit;
        }

        .modal-page-wrapper {
            width: 100%;
            min-height: 100vh;
            padding: 34px 36px;
            background: white;
        }

        .karte,
        .seiten-karte {
            max-width: 920px;
            margin: 0 auto;
            padding: 0;
            box-shadow: none;
            border-radius: 0;
            background: white;
        }

        .button-primary,
        .button-secondary,
        .button-danger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        .button-primary {
            background: var(--dpz-green);
            color: white;
        }

        .button-primary:hover {
            background: var(--dpz-green-dark);
        }

        .button-secondary {
            background: #555;
            color: white;
        }

        .button-secondary:hover {
            background: #333;
        }

        input,
        select,
        textarea {
            font-family: inherit;
        }

        .fehler-box {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff1f1;
            color: #8a1f1f;
            border: 1px solid #f0c5c5;
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .modal-page-wrapper {
                padding: 22px 18px;
            }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="modal-page-wrapper">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
